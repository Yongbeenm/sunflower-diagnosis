{% extends "base.html" %}
{% block title %}Symptom Checker{% endblock %}

{% block content %}
<form method="post" action="{{ diagnose_payload.formAction }}" id="sf-diagnose-form">
  {{ form.hidden_tag() }}
  <div id="sf-diagnose-react-root" class="min-h-[60vh]">
    <div class="rounded-[28px] border border-white/60 bg-white/70 p-6 shadow-[0_24px_64px_rgba(36,56,29,0.14)] backdrop-blur dark:border-white/10 dark:bg-[#132017]/80">
      <div class="h-10 w-56 animate-pulse rounded-full bg-[#dce9cf] dark:bg-white/10"></div>
      <div class="mt-4 h-16 max-w-3xl animate-pulse rounded-[24px] bg-[#edf3e5] dark:bg-white/10"></div>
      <div class="mt-6 grid gap-4 xl:grid-cols-[1fr_320px]">
        <div class="h-[28rem] animate-pulse rounded-[24px] bg-[#edf3e5] dark:bg-white/10"></div>
        <div class="h-80 animate-pulse rounded-[24px] bg-[#edf3e5] dark:bg-white/10"></div>
      </div>
    </div>
  </div>
</form>
<script id="sf-diagnose-data" type="application/json">{{ diagnose_payload | tojson }}</script>
{% endblock %}
